name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一支新 push 到 main 时取消仍在跑的旧部署，避免排队堆积
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public AI endpoint
        env:
          VITE_SCENEWEAVE_AI_URL: ${{ vars.VITE_SCENEWEAVE_AI_URL }}
        run: |
          if [ -n "$VITE_SCENEWEAVE_AI_URL" ]; then
            node --input-type=module -e 'const url = new URL(process.env.VITE_SCENEWEAVE_AI_URL); if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) process.exit(1)'
          fi
      # base 前缀（/sceneweave/）由 vite.config.ts 统一提供
      - name: Build
        env:
          # This is a public endpoint only; application/provider credentials never enter Pages builds.
          VITE_SCENEWEAVE_AI_URL: ${{ vars.VITE_SCENEWEAVE_AI_URL }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
